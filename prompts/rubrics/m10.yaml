acceptanceCriteria:
  - dokümanın yalnızca varlığını değil yeterliliğini değerlendirmeli
  - eksikleri göstermeli
  - koddan çıkarılan mimari görünümü özetlemeli
  - kullanılabilir içerik şablonu önermeli.
  - Owner/destek bilgisi repo'da yoksa uydurmamalı.
severityGuide:
  critical: Yanlış operasyon talimatı kritik sistem veya veri üzerinde doğrudan yıkıcı işlem riski yaratıyor.
  high: Eksik ya da yanlış sahiplik ve operasyon bilgisi önemli müdahale riskine sahip.
  medium: Mimari, API veya kurulum belgesi doğrulanmış biçimde önemli kullanım hatası yaratıyor.
  low: Yerel doküman veya yönetişim eksikliği sınırlı onboarding ve bakım yükü oluşturuyor.
  info: Kanıtlı, risk oluşturmayan dokümantasyon iyileştirme fırsatı.
