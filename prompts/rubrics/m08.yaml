acceptanceCriteria:
  - Dockerfile ve deployment manifestlerini birlikte değerlendirmeli
  - güvenlik ve operasyon risklerini ayrı açıklamalı
  - uygun base image veya non-root çalışma önermeli
  - kanıtı olmayan altyapı konularında varsayım yapmamalı.
severityGuide:
  critical: Image veya çalışma yapılandırması kritik secret'ı ya da host'u doğrudan açığa çıkarıyor.
  high: Root çalışma, güvensiz image veya kalıcı state önemli güvenlik ya da süreklilik riski yaratıyor.
  medium: Health, limit veya build yapısı operasyon dayanıklılığını somut biçimde zayıflatıyor.
  low: Image ve environment yapılandırması sınırlı boyut veya bakım yükü yaratıyor.
  info: Kanıtlı, risk oluşturmayan container iyileştirme fırsatı.
