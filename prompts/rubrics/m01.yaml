severityGuide:
  critical: Mimari sınır ihlali doğrudan geniş yetki veya veri bütünlüğü kaybı yaratıyor.
  high: Döngü veya ters bağımlılık kritik değişiklik ve hata riskini belirgin artırıyor.
  medium: Sorumluluk veya katman ayrımı sürdürülebilirliği somut biçimde zayıflatıyor.
  low: Yerel isimlendirme ya da ortak bileşen sapması sınırlı bakım yükü yaratıyor.
  info: Kanıtlı, risk oluşturmayan mimari iyileştirme fırsatı.
