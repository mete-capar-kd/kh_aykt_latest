acceptanceCriteria:
  - observability eksikliğini doğru tespit etmeli
  - loglama ile monitoring kavramlarını karıştırmamalı
  - hassas veri loglarını güvenlik riskiyle ilişkilendirmeli
  - kurum standardına uygun çözüm önermeli.
severityGuide:
  critical: Log veya telemetry doğrulanmış biçimde geniş kapsamlı hassas veri açığa çıkarıyor.
  high: Kritik hata ve bağımlılıklar izlenemiyor ya da önemli hassas veri kaydı bulunuyor.
  medium: Correlation, tracing veya merkezi hata eksikliği olay çözümünü somut biçimde engelliyor.
  low: Log seviyesi veya telemetry ayrıntısı sınırlı operasyon yükü yaratıyor.
  info: Kanıtlı, risk oluşturmayan observability iyileştirme fırsatı.
