acceptanceCriteria:
  - potansiyel ve kesin performans sorunlarını ayırmalı (`confidence`)
  - sorunun etkisini açıklamalı
  - ölçüm gerektiren konularda kesin hüküm vermemeli
  - profiling veya yük testi ihtiyacını belirtebilmeli.
severityGuide:
  critical: Dayanıklılık hatası geniş kesinti veya geri döndürülemez işlem tekrarı yaratıyor.
  high: Blocking, sınırsız sorgu veya hatalı retry kritik akışı belirgin biçimde çökertiyor.
  medium: Timeout, cache veya ölçek tasarımı gerçek yükte somut risk taşıyor.
  low: Sınırlı performans ya da dayanıklılık sapması yerel maliyet yaratıyor.
  info: Kanıtlı, risk oluşturmayan performans iyileştirme fırsatı.
