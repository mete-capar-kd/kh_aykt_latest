acceptanceCriteria:
  - yalnızca test dosyası sayısına bakmamalı
  - assertion kalitesini değerlendirmeli
  - kritik akışların test edilip edilmediğini değerlendirmeli
  - quality gate durumunu değerlendirmeli
  - test piramidine uygun iyileştirme ihtiyacını değerlendirmeli.
severityGuide:
  critical: Test boşluğu kritik güvenlik veya geri döndürülemez veri akışını doğrulamasız bırakıyor.
  high: Kritik iş kuralı ya da teslimat kapısı önemli regresyonu yakalayamıyor.
  medium: Assertion, mock veya kapsam zayıflığı gerçek davranış riskini artırıyor.
  low: Test yapısı ya da kalite yapılandırması sınırlı bakım yükü yaratıyor.
  info: Kanıtlı, risk oluşturmayan test kalitesi iyileştirme fırsatı.
