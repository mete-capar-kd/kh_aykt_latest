acceptanceCriteria:
  - veri tutarlılığı veya entegrasyon dayanıklılığı etkisini açıklamalı
  - ilgili kod bloğunu göstermeli
  - genel öneri yerine teknik çözüm sunmalı
  - retry önerirken idempotency riskini dikkate almalı.
severityGuide:
  critical: Akış doğrulanmış biçimde geri döndürülemez veri kaybı veya geniş hassas veri açığı yaratıyor.
  high: Transaction veya entegrasyon hatası önemli tutarsızlık ya da kesinti riski taşıyor.
  medium: Dayanıklılık veya veri yönetimi sapması sınırlı koşullarda gerçek etki yaratıyor.
  low: Yerel istemci, versioning veya migration sapması bakım ve operasyon yükü oluşturuyor.
  info: Kanıtlı, risk oluşturmayan veri ya da entegrasyon iyileştirme fırsatı.
