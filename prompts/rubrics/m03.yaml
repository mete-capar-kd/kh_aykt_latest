acceptanceCriteria:
  - güvenlik açığını doğru sınıflandırmalı
  - secret değerlerini raporda açık göstermemeli
  - kanıtı dosya/satır bilgisiyle sunmalı
  - güvenli alternatif önermeli
  - kritik bulguları yüksek öncelikle raporlamalı.
severityGuide:
  critical: Doğrudan erişilebilir secret veya sömürülebilir akış kritik sistem ya da veri kaybı yaratıyor.
  high: Güvenlik kontrolü eksikliği önemli gizlilik veya bütünlük etkisine sahip.
  medium: Sömürü ek koşul gerektiriyor ancak doğrulanmış güvenlik riski bulunuyor.
  low: Savunma derinliği zayıf ve etkisi sınırlı.
  info: Kanıtlı, risk oluşturmayan güvenlik güçlendirme fırsatı.
