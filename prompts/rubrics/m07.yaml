acceptanceCriteria:
  - pipeline dosyalarını analiz etmeli
  - eksik aşamaları doğru sıralamayla açıklamalı
  - kaynak koddan doğrulanamayacak branch policy konularında varsayım yapmamalı
  - kanıt yoksa `Değerlendirilemedi` statüsünü kullanmalı.
severityGuide:
  critical: Teslimat akışı production secret'ını veya kritik sistemi doğrudan açığa çıkarıyor.
  high: Doğrulamasız artifact ya da kontrolsüz production deployment önemli risk yaratıyor.
  medium: Eksik test, tarama veya ortam ayrımı teslimat güvencesini somut biçimde zayıflatıyor.
  low: Pipeline veya artifact yönetimi sapması sınırlı operasyon yükü yaratıyor.
  info: Kanıtlı, risk oluşturmayan teslimat iyileştirme fırsatı.
